spring:
  application:
    name: lms-backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB

server:
  port: ${SERVER_PORT:8080}

app:
  ai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  security:
    jwt-secret: ${JWT_SECRET:}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  storage:
    directory: ${STORAGE_DIRECTORY:./.storage}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Optional external services: secrets are read only by the backend.
# Use application properties / environment placeholders below.
