services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: lms
      MARIADB_USER: ${DB_USERNAME:-lms}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - lms-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  lms-db:
